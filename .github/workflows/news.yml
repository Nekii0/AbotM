# Refreshes news.json (Baguio headlines for the homepage) every 3 hours.
name: Update news
on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-news.mjs
      - name: Commit if headlines changed
        run: |
          git diff --quiet news.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update news headlines"
          git push
